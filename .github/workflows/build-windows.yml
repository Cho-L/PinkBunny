name: Windows build and beginner download
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify and build
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          go build -trimpath -ldflags="-s -w" -o PinkBunny.exe .
      - name: Create easy-download bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/PinkBunny/extension | Out-Null
          Copy-Item PinkBunny.exe dist/PinkBunny/
          Copy-Item extension/* dist/PinkBunny/extension/
          Copy-Item "INSTALL_KO.txt" dist/PinkBunny/
          Compress-Archive -Path dist/PinkBunny -DestinationPath dist/PinkBunny-Windows.zip -CompressionLevel Optimal -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinkBunny-Windows
          path: dist/PinkBunny-Windows.zip
          retention-days: 30
      - name: Publish/update beta download link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view beta | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create beta --target $env:GITHUB_SHA --title "Pink Bunny - 최신 베타 다운로드" --notes "Windows: PinkBunny-Windows.zip 다운로드 → 압축해제 → INSTALL_KO.txt를 순서대로 따라하세요. 아직 실제 다수 Windows/OBS 환경 검증 전 베타입니다." --prerelease
          }
          gh release upload beta "dist/PinkBunny-Windows.zip" --clobber
