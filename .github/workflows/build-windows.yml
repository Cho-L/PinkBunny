name: Windows build and beginner download
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pinkbunny-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify and build
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --test tests/extension-content.test.cjs tests/background.test.cjs tests/popup.test.cjs tests/docs.test.cjs
          node --check overlay/app.js
          node --check overlay/theme-settings.js
          Get-Content extension/manifest.json -Raw | ConvertFrom-Json | Out-Null
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o PinkBunny.exe .
      - name: Smoke-test packaged Windows app and setup endpoints
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "PinkBunny.exe"
          $app = Start-Process -FilePath $exe -ArgumentList "--silent" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 25; $i++) {
              if ($app.HasExited) { throw "PinkBunny.exe terminated before serving requests" }
              try {
                $state = Invoke-RestMethod -Uri "http://127.0.0.1:38765/api/status" -TimeoutSec 2
                if ($null -ne $state.connected) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 400 }
            }
            if (-not $ready) { throw "PinkBunny server did not start" }
            $theme = Invoke-RestMethod -Uri "http://127.0.0.1:38765/api/theme" -TimeoutSec 3
            if (-not $theme.color) { throw "Theme endpoint returned invalid data" }
            $avatar = Invoke-RestMethod -Uri "http://127.0.0.1:38765/api/avatar/info" -TimeoutSec 3
            if ($null -eq $avatar.present) { throw "Avatar info response missing" }
            $setup = (Invoke-WebRequest -Uri "http://127.0.0.1:38765/setup" -TimeoutSec 3).Content
            if (-not $setup.Contains("Pink Bunny")) { throw "Setup wizard unavailable" }
            $guide = (Invoke-WebRequest -Uri "http://127.0.0.1:38765/guide" -TimeoutSec 3).Content
            if (-not $guide.Contains("guide-quickstart-1pc.svg") -or -not $guide.Contains("guide-feature-tabs.svg")) { throw "Illustrated install and feature guides unavailable" }
            foreach ($name in @("guide-quickstart-1pc.svg", "guide-quickstart-2pc.svg", "guide-chrome-extension.svg", "guide-obs-source.svg", "guide-feature-extension.svg", "guide-feature-tabs.svg", "guide-feature-controls.svg", "guide-feature-design.svg", "guide-feature-remote.svg", "guide-feature-filters.svg", "guide-feature-troubleshoot.svg")) {
              $picture = Invoke-WebRequest -Uri "http://127.0.0.1:38765/$name" -TimeoutSec 3
              if ($picture.Headers["Content-Type"] -notmatch "image/svg\+xml" -or -not $picture.Content.Contains("<svg")) {
                throw "Visual guide was not served as SVG: $name"
              }
            }
            Write-Host "QA: executable startup, server, setup and illustrated guides PASS"
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Create easy-download bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/PinkBunny/extension | Out-Null
          Copy-Item PinkBunny.exe dist/PinkBunny/
          Copy-Item extension/* dist/PinkBunny/extension/
          Copy-Item "INSTALL_KO.txt" dist/PinkBunny/
          New-Item -ItemType Directory -Force -Path dist/PinkBunny/guide | Out-Null
          Copy-Item overlay/guide.html dist/PinkBunny/guide/index.html
          Copy-Item overlay/guide-*.svg dist/PinkBunny/guide/
          Compress-Archive -Path dist/PinkBunny -DestinationPath dist/PinkBunny-Windows.zip -CompressionLevel Optimal -Force
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler missing" }
      - name: Build beginner-friendly Windows setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          & $iscc installer/PinkBunny.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (-not (Test-Path dist/PinkBunny-Setup.exe)) { throw "Installer output missing" }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinkBunny-Windows
          path: dist/PinkBunny-Windows.zip
          retention-days: 30
      - name: Publish/update beta download link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view beta | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create beta --target $env:GITHUB_SHA --title "Pink Bunny - 최신 베타 다운로드" --notes "Windows: PinkBunny-Windows.zip 다운로드 → 압축해제 → INSTALL_KO.txt를 순서대로 따라하세요. 아직 실제 다수 Windows/OBS 환경 검증 전 베타입니다." --prerelease
          }
          gh release upload beta "dist/PinkBunny-Windows.zip" "dist/PinkBunny-Setup.exe" --clobber
