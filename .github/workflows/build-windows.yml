name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build EXE
        shell: pwsh
        run: go build -trimpath -ldflags="-s -w" -o PinkBunny.exe .
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PinkBunny-Windows
          path: PinkBunny.exe
          retention-days: 30
