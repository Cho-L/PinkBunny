<!doctype html><html lang="ko"><head><meta charset="UTF-8"><style>
body{font:13px/1.6 system-ui,sans-serif;width:290px;margin:0;padding:18px;background:#fff0f7;color:#63435a}h2{margin:0 0 10px;font-size:17px}label{display:block;margin:10px 0 3px}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #e2a5c5;border-radius:8px}button{background:#df79a8;border:0;border-radius:8px;padding:8px 15px;color:white;margin-top:12px;cursor:pointer}#status{margin-top:10px}small{display:block;margin-top:8px;color:#956f82}
</style></head><body><h2>🐰 Pink Bunny 연결</h2>
<button id="auto" style="width:100%">✨ 1컴 자동 연결</button>
<label>2컴 연결 주소 붙여넣기</label><input id="pair" placeholder="pinkbunny://pair?host=..." autocomplete="off">
<button id="apply">2컴 연결 주소 적용</button>
<hr style="margin:15px 0;border:0;border-top:1px solid #eac0d5">
<label>서버 PC IPv4 주소 (1컴이면 127.0.0.1)</label><input id="server" placeholder="192.168.0.10" autocomplete="off">
<label>연결 코드 (PinkBunny.exe 창에 표시)</label><input id="key" placeholder="8자리 코드" maxlength="8" autocomplete="off">
<button id="save">저장 및 연결 확인</button><div id="status">설정을 입력해 주세요.</div>
<small>1컴은 자동 연결 버튼만 누르세요. 2컴은 송출 PC 설치 도우미의 연결 주소를 붙여넣으면 됩니다. 아래 주소·코드는 수동 설정용입니다.</small>
<script src="popup.js"></script></body></html>
