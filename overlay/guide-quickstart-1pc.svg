23" fill="#67516a" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="500" text-anchor="start">크롬 툴바에서 Pink Bunny를 열어요.</text><text x="106" y="638" font-size="23" fill="#67516a" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="500" text-anchor="start">연결 설정 → 1컴 자동 연결 선택</text><rect x="105" y="694" width="560" height="39" rx="10" fill="#f8f0f7" stroke="none" stroke-width="1"/><text x="119" y="721" font-size="20" fill="#9b407d" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="650" text-anchor="start">서버 주소·연결 코드는 입력 불필요</text><rect x="745" y="479" width="620" height="272" rx="26" fill="#fff" stroke="#f0dae8" stroke-width="2"/><rect x="771" y="503" width="52" height="52" rx="17" fill="#fce4f1" stroke="none" stroke-width="1"/><text x="797" y="540" font-size="29" fill="#c5528f" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="800" text-anchor="middle">4</text><text x="845" y="541" font-size="31" fill="#46304b" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="700" text-anchor="start">OBS에 브라우저 소스 추가</text><text x="776" y="600" font-size="23" fill="#67516a" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="500" text-anchor="start">소스 + → 브라우저를 선택하고</text><text x="776" y="638" font-size="23" fill="#67516a" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="500" text-anchor="start">주소와 크기를 입력해요.</text><rect x="775" y="694" width="560" height="39" rx="10" fill="#f8f0f7" stroke="none" stroke-width="1"/><text x="789" y="721" font-size="20" fill="#9b407d" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="650" text-anchor="start">127.0.0.1:38765  |  420 × 130</text><rect x="75" y="783" width="1290" height="110" rx="24" fill="#d85f9a" stroke="none" stroke-width="1"/><text x="117" y="833" font-size="33" fill="#fff" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="800" text-anchor="start">5</text><text x="160" y="833" font-size="30" fill="#fff" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="750" text-anchor="start">Chrome에서 유튜브 음악 재생 → OBS에 제목 표시!</text><text x="160" y="869" font-size="23" fill="#fff3f8" font-family="'Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif" font-weight="500" text-anchor="start">2컴 방송이어도 송출 PC에서 음악을 재생하면 이 안내를 사용하면 됩니다.</text></svg>