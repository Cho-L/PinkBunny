<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-label="Pink Bunny 기능 사용 가이드 - 보여줄 탭 고정·숨기기"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFF9FC"/><stop offset="1" stop-color="#FCE6F3"/></linearGradient></defs><rect x="0" y="0" width="1440" height="1090" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><text x="70" y="75" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="31" font-weight="740" fill="#BC598D" text-anchor="start">Pink Bunny  |  그림으로 배우는 기능 사용법</text><text x="70" y="142" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="49" font-weight="840" fill="#50374D" text-anchor="start">보여줄 탭 고정·숨기기</text><text x="70" y="192" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="550" fill="#7E5A72" text-anchor="start">여러 유튜브 탭 중 방송에 보여줄 영상 선택</text><rect x="1085" y="76" width="278" height="46" rx="23" fill="#FCE2EF" stroke="none" stroke-width="1"/><text x="1224" y="107" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="760" fill="#B25085" text-anchor="middle">OBS 표시 관리</text><rect x="69" y="252" width="637" height="156" rx="22" fill="#fff" stroke="#EED0E1" stroke-width="1.4"/><rect x="92" y="280" width="52" height="52" rx="17" fill="#FBE1ED" stroke="none" stroke-width="1"/><text x="118" y="315" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="29" font-weight="850" fill="#C6538A" text-anchor="middle">1</text><text x="159" y="316" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="27" font-weight="780" fill="#4E3A50" text-anchor="start">자동 선택</text><text x="103" y="368" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="480" fill="#75596F" text-anchor="start">기본적으로 재생 중인 탭을 우선 표시</text><rect x="69" y="425" width="637" height="156" rx="22" fill="#fff" stroke="#EED0E1" stroke-width="1.4"/><rect x="92" y="453" width="52" height="52" rx="17" fill="#FBE1ED" stroke="none" stroke-width="1"/><text x="118" y="488" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="29" font-weight="850" fill="#C6538A" text-anchor="middle">2</text><text x="159" y="489" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="27" font-weight="780" fill="#4E3A50" text-anchor="start">한 탭만 고정</text><text x="103" y="541" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="480" fill="#75596F" text-anchor="start">현재 탭에서 ‘이 탭 고정’ 클릭</text><rect x="69" y="598" width="637" height="156" rx="22" fill="#fff" stroke="#EED0E1" stroke-width="1.4"/><rect x="92" y="626" width="52" height="52" rx="17" fill="#FBE1ED" stroke="none" stroke-width="1"/><text x="118" y="661" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="29" font-weight="850" fill="#C6538A" text-anchor="middle">3</text><text x="159" y="662" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="27" font-weight="780" fill="#4E3A50" text-anchor="start">비공개 탭 숨기기</text><text x="103" y="714" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="480" fill="#75596F" text-anchor="start">‘이 탭 숨기기’ → OBS 목록에서 제외</text><rect x="69" y="771" width="637" height="156" rx="22" fill="#fff" stroke="#EED0E1" stroke-width="1.4"/><rect x="92" y="799" width="52" height="52" rx="17" fill="#FBE1ED" stroke="none" stroke-width="1"/><text x="118" y="834" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="29" font-weight="850" fill="#C6538A" text-anchor="middle">4</text><text x="159" y="835" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="27" font-weight="780" fill="#4E3A50" text-anchor="start">원상복구</text><text x="103" y="887" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="480" fill="#75596F" text-anchor="start">‘다시 표시’ 또는 ‘자동 선택으로’</text><rect x="750" y="252" width="615" height="686" rx="24" fill="#fff" stroke="#EFCDE2" stroke-width="2"/><rect x="776" y="277" width="565" height="65" rx="18" fill="#FFECF5" stroke="none" stroke-width="1"/><text x="806" y="319" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="800" fill="#AF4881" text-anchor="start">🐰 Pink Bunny</text><text x="792" y="378" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="720" fill="#7E6071" text-anchor="start">크롬 확장 프로그램 기능</text><rect x="787" y="405" width="530" height="54" rx="14" fill="#FAF0F7" stroke="none" stroke-width="1"/><text x="810" y="440" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="27" font-weight="750" fill="#7E426B" text-anchor="start">OBS에 표시할 유튜브 탭</text><rect x="787" y="481" width="530" height="70" rx="13" fill="#F4E9F3" stroke="none" stroke-width="1"/><text x="811" y="525" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#6B5269" text-anchor="start">자동 선택 (재생 중인 탭)</text><rect x="788" y="566" width="248" height="61" rx="12" fill="#D76C9F" stroke="none" stroke-width="1"/><text x="912" y="605.5" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="730" fill="#fff" text-anchor="middle">이 탭 고정</text><rect x="1048" y="566" width="261" height="61" rx="12" fill="#D76C9F" stroke="none" stroke-width="1"/><text x="1178.5" y="605.5" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="730" fill="#fff" text-anchor="middle">이 탭 숨기기</text><rect x="788" y="655" width="248" height="59" rx="12" fill="#F5E6F0" stroke="#E8B6D3" stroke-width="1"/><text x="912" y="693.5" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="730" fill="#8D4F73" text-anchor="middle">다시 표시</text><rect x="1048" y="655" width="261" height="59" rx="12" fill="#F5E6F0" stroke="#E8B6D3" stroke-width="1"/><text x="1178.5" y="693.5" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="730" fill="#8D4F73" text-anchor="middle">자동 선택으로</text><text x="799" y="894" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="480" fill="#957789" text-anchor="start">* 설명을 위한 화면 구성 예시입니다.</text><rect x="69" y="968" width="1300" height="87" rx="18" fill="#F8DCEB" stroke="none" stroke-width="1"/><text x="96" y="1006" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="780" fill="#AC4D81" text-anchor="start">꼭 알아두세요</text><text x="96" y="1040" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="520" fill="#654D60" text-anchor="start">숨기기는 OBS 표시만 막습니다. 검색·시청 기록은 삭제되지 않습니다.</text></svg>