"740" fill="#79566F" text-anchor="start">소리 안 들림 → OBS 오디오 캡처</text><text x="799" y="894" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="480" fill="#957789" text-anchor="start">* 설명을 위한 화면 구성 예시입니다.</text><rect x="69" y="968" width="1300" height="87" rx="18" fill="#F8DCEB" stroke="none" stroke-width="1"/><text x="96" y="1006" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="780" fill="#AC4D81" text-anchor="start">꼭 알아두세요</text><text x="96" y="1040" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="520" fill="#654D60" text-anchor="start">2컴은 동일 사설망·Windows 방화벽을 확인하고, 포트포워딩은 하지 마세요.</text></svg>